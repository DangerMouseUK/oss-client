name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# oss-core is consumed as a sibling path dependency (../oss-core), so both repos
# are checked out side by side.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: oss-client
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-client
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core
      - name: Linux system libraries (windowing, audio, gamepad)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oss-client
      # Plain `cargo fmt`, never `--all`: `--all` takes its package list from
      # `cargo metadata`, which here reaches the ../oss-core checkout above --
      # 34 of the 43 source roots it covers are in that repo -- so this repo's
      # CI would go red for a formatting fault in a different one.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oss-client
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-client
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core
      # cargo doc runs build scripts, so this needs the same system libraries
      # the test job installs.
      - name: Linux system libraries (windowing, audio, gamepad)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oss-client
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oss-client
      - uses: actions/checkout@v4
        with:
          repository: DangerMouseUK/oss-core
          path: oss-core
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: oss-client/Cargo.toml
