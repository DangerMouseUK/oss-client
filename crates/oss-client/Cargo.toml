[package]
name = "oss-client"
description = "Open SubSpace game client, compatible with SubSpace/Continuum zones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-or-later"
repository.workspace = true

[dependencies]
oss-proto.workspace = true
oss-net.workspace = true
oss-formats.workspace = true
oss-sim.workspace = true
oss-assets.workspace = true
oss-session.workspace = true
winit = "0.30"
wgpu = "30"
gilrs = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
png = "0.18"
cpal = "0.18"
env_logger = "0.11"
# The clock above the radar. Already in the tree under env_logger; this only asks
# it for the system time zone, which std has no way to read.
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
    "tzdb-concatenated",
    "tzdb-bundle-platform",
] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }

[lints]
workspace = true
