[package]
name = "oss-credstore"
description = "Remembers a player's password in the operating system's own credential store, and nowhere else"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-or-later"
repository.workspace = true

# One vault per operating system, and only that one. These are the
# `keyring` project's own store crates, used through `keyring-core`
# directly: the `keyring` crate's documentation says that an application
# which chooses its stores should link these rather than `keyring` itself.
#
# Linux uses the pure-Rust Secret Service client (zbus), so building the
# client needs no system D-Bus library, and `crypto-rust` encrypts the
# password on its way to the keyring without OpenSSL.
[dependencies]
log = "0.4"
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
