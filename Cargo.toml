[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
repository = "https://github.com/DangerMouseUK/oss-client"

[workspace.dependencies]
# Shared crates from the sibling oss-core checkout (see README "Building").
oss-proto = { path = "../oss-core/crates/oss-proto" }
oss-net = { path = "../oss-core/crates/oss-net" }
oss-formats = { path = "../oss-core/crates/oss-formats" }
oss-sim = { path = "../oss-core/crates/oss-sim" }
oss-assets = { path = "crates/oss-assets" }
oss-session = { path = "crates/oss-session" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
